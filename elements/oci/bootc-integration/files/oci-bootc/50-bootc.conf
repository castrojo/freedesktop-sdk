# Enable bootc's composefs root setup in Dracut.
#
# This drop-in is shipped into the container image so that `bootc` (and
# `ostree`) can regenerate the initramfs on install/upgrade with the `bootc`
# dracut module enabled, matching the initramfs generated at build time by
# `oci/layers/bootc-kernel.bst`.
add_dracutmodules+=" bootc "
